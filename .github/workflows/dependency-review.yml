# security-template: dependency-review
# =============================================================================
#  SCA - Revue des dépendances sur chaque Pull Request
# -----------------------------------------------------------------------------
#  Rôle      : comparer les dépendances de la PR à celles de la branche cible
#              et BLOQUER la PR si elle introduit une dépendance vulnérable
#              (ou une licence interdite).
#  Résultats : résumé dans les logs du job + commentaire dans la PR en cas
#              d'échec.
#  Complément: les dépendances DÉJÀ présentes sont suivies par les alertes
#              Dependabot.
#  Licence   : gratuit sur repo public ; "GitHub Code Security" requis sur
#              repo privé d'organisation. Le "dependency graph" doit être actif.
#
#  Fichier généré depuis CONFIGURATION.md (clés ENABLE_DEPENDENCY_REVIEW,
#  FAIL_ON_SEVERITY, DENY_LICENSES).
#  Ne renommez pas le "name" du job : il sert de check obligatoire dans le ruleset.
# =============================================================================

name: "SCA - Dependency Review"

on:
  pull_request:
    branches: ["main"]

permissions: {}

jobs:
  dependency-review:
    name: "SCA - Dependency Review"
    if: vars.SECURITY_SCANS_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write              # nécessaire pour commenter la PR

    steps:
      - name: Récupération du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Revue des dépendances
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Gravité minimale qui fait échouer la PR : low | moderate | high | critical
          fail-on-severity: high

          # Périmètre analysé : runtime | development | unknown
          fail-on-scopes: runtime, unknown

          # Commentaire de synthèse dans la PR : always | on-failure | never
          comment-summary-in-pr: on-failure

          # Affiche la version corrigée quand elle existe.
          show-patched-versions: true

          # Exceptions documentées : identifiants GHSA acceptés temporairement
          # (voir la procédure d'exceptions).
          # allow-ghsas: GHSA-xxxx-xxxx-xxxx

          # Mode non bloquant pour une phase d'adoption progressive.
          # warn-only: true
