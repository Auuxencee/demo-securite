# security-template: secrets
# =============================================================================
#  Secrets - Détection de secrets dans l'historique Git avec Gitleaks
# -----------------------------------------------------------------------------
#  Rôle      : rechercher clés d'API, mots de passe, tokens et clés privées
#              dans les commits.
#                - sur une PR : uniquement les commits de la PR (rapide) ;
#                - sur la branche principale / chaque semaine : tout l'historique.
#  Pourquoi en plus du "secret scanning" natif de GitHub ?
#              - fonctionne sur un repo privé SANS licence "Secret Protection" ;
#              - règles personnalisables (.gitleaks.toml) pour des formats de
#                secrets internes à l'entreprise ;
#              - donne un check bloquant sur la PR.
#              Avec la licence, le natif reste la première ligne de défense
#              (push protection = blocage AVANT que le secret n'arrive sur GitHub).
#  Résultats : onglet "Security > Code scanning" (outil "gitleaks") + artefact.
#              Les secrets sont masqués (--redact) dans les logs et le rapport.
#  Blocage   : le job échoue dès qu'un secret est détecté.
#
#  Un secret détecté doit être considéré comme compromis : RÉVOQUEZ-LE puis
#  remplacez-le. Le supprimer du code ne suffit pas (il reste dans l'historique).
#
#  Fichier généré depuis CONFIGURATION.md (clés ENABLE_SECRETS_SCAN, DEFAULT_BRANCH).
#  Ne renommez pas le "name" du job : il sert de check obligatoire dans le ruleset.
# =============================================================================

name: "Secrets - Gitleaks"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: secrets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Version figée. Le binaire est téléchargé depuis la release officielle et
  # son empreinte SHA-256 vérifiée avant exécution.
  GITLEAKS_VERSION: "8.30.1"

jobs:
  gitleaks:
    name: "Secrets - Gitleaks"
    if: vars.SECURITY_SCANS_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Récupération du code (historique complet)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0                # nécessaire pour analyser l'historique
          persist-credentials: false

      - name: Installation de Gitleaks (avec vérification d'intégrité)
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd "${RUNNER_TEMP}"
          curl -sSfLO "${base}/${archive}"
          curl -sSfLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum --check --strict
          tar -xzf "${archive}" gitleaks
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Recherche de secrets
        id: scan
        shell: bash
        env:
          # Valeurs passées par variables d'environnement (et non interpolées
          # dans le script) pour éviter toute injection de commande.
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          # La configuration .gitleaks.toml (racine du repo) est lue automatiquement.
          args=(git --report-format sarif --report-path gitleaks.sarif --redact --no-banner --exit-code 1)
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            args+=(--log-opts="${BASE_SHA}..${HEAD_SHA}")
          fi
          gitleaks "${args[@]}" .
          rc=$?
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          exit 0                        # l'échec est rendu plus bas, après publication du rapport

      - name: Publication dans l'onglet Security
        if: always() && hashFiles('gitleaks.sarif') != ''
        continue-on-error: true         # échoue sans licence Code Security (repo privé)
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: gitleaks.sarif
          category: secrets

      - name: Archivage du rapport
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          retention-days: 30

      - name: Contrôle bloquant
        if: steps.scan.outputs.exit_code != '0'
        shell: bash
        env:
          RC: ${{ steps.scan.outputs.exit_code }}
        run: |
          if [ "${RC}" = "1" ]; then
            echo "::error::Secret détecté : révoquez-le puis retirez-le du code."
            echo "Faux positif ? Suivez la procédure d'exceptions (fichier .gitleaks.toml)."
          else
            echo "::error::Gitleaks s'est terminé avec le code ${RC} (erreur d'exécution)."
          fi
          exit 1
